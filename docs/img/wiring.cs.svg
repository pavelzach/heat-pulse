<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>Schéma zapojení HeatPulse</title>
  <desc>ESP32-DevKitC-32E s převodníkem MAX6675 a termočlánkem K, modulem microSD, sondou DS18B20 s pull-up rezistorem 4,7 kΩ a volitelným čidlem místnosti SHT40. Logické schéma, ne fyzické pořadí pinů desky.</desc>
  <defs>
    <g id="gnd" stroke="#111827" stroke-width="2" fill="none">
      <line x1="0" y1="0" x2="0" y2="12"/>
      <line x1="-10" y1="12" x2="10" y2="12"/>
      <line x1="-6" y1="16" x2="6" y2="16"/>
      <line x1="-2" y1="20" x2="2" y2="20"/>
    </g>
    <g id="vcc">
      <line x1="0" y1="0" x2="0" y2="-14" stroke="#dc2626" stroke-width="2"/>
      <line x1="-10" y1="-14" x2="10" y2="-14" stroke="#dc2626" stroke-width="2"/>
      <text x="0" y="-19" text-anchor="middle" fill="#dc2626" font-size="12" font-weight="600">3V3</text>
    </g>
  </defs>

  <rect x="0" y="0" width="1000" height="580" fill="#ffffff"/>

  <!-- ===== ESP32 ===== -->
  <rect x="400" y="90" width="200" height="380" rx="10" fill="#eef2ff" stroke="#3730a3" stroke-width="2"/>
  <text x="500" y="248" text-anchor="middle" font-size="18" font-weight="700" fill="#1e1b4b">ESP32</text>
  <text x="500" y="266" text-anchor="middle" font-size="12" fill="#3730a3">DevKitC-32E</text>
  <g font-size="12" fill="#1e1b4b">
    <text x="408" y="144">GPIO25</text>
    <text x="408" y="174">GPIO26</text>
    <text x="408" y="204">GPIO27</text>
    <text x="408" y="314">GPIO18</text>
    <text x="408" y="344">GPIO19</text>
    <text x="408" y="374">GPIO23</text>
    <text x="408" y="404">GPIO21</text>
    <text x="592" y="154" text-anchor="end">GPIO32</text>
    <text x="592" y="344" text-anchor="end">GPIO33</text>
    <text x="592" y="374" text-anchor="end">GPIO22</text>
    <text x="450" y="108" text-anchor="middle">3V3</text>
    <text x="470" y="462" text-anchor="middle">USB</text>
    <text x="550" y="462" text-anchor="middle">GND</text>
  </g>
  <use href="#vcc" x="450" y="90"/>
  <use href="#gnd" x="550" y="470"/>
  <line x1="470" y1="470" x2="470" y2="496" stroke="#6b7280" stroke-width="2"/>
  <text x="470" y="512" text-anchor="middle" font-size="12" fill="#374151">micro-USB 5 V</text>
  <text x="470" y="527" text-anchor="middle" font-size="12" fill="#374151">(USB adaptér, ≥ 1 A)</text>

  <!-- ===== MAX6675 + thermocouple ===== -->
  <rect x="150" y="110" width="150" height="120" rx="6" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <text x="214" y="172" text-anchor="middle" font-weight="700">MAX6675</text>
  <text x="224" y="190" text-anchor="middle" font-size="11" fill="#6b7280">převodník K</text>
  <g font-size="11" fill="#374151">
    <text x="292" y="144" text-anchor="end">SO</text>
    <text x="292" y="174" text-anchor="end">SCK</text>
    <text x="292" y="204" text-anchor="end">CS</text>
    <text x="158" y="154">T+</text>
    <text x="158" y="194">T−</text>
  </g>
  <use href="#vcc" x="185" y="110"/>
  <use href="#gnd" x="265" y="230"/>
  <g stroke="#2563eb" stroke-width="2.5">
    <line x1="300" y1="140" x2="400" y2="140"/>
    <line x1="300" y1="170" x2="400" y2="170"/>
    <line x1="300" y1="200" x2="400" y2="200"/>
  </g>
  <text x="350" y="130" text-anchor="middle" font-size="11" fill="#2563eb">softwarové SPI</text>
  <g stroke="#9a3412" stroke-width="2" fill="none">
    <polyline points="150,150 105,150 74,170"/>
    <polyline points="150,190 105,190 74,170"/>
  </g>
  <circle cx="70" cy="170" r="6" fill="#9a3412"/>
  <text x="70" y="204" text-anchor="middle" font-size="12" fill="#9a3412" font-weight="600">termočlánek K</text>
  <text x="70" y="220" text-anchor="middle" font-size="12" fill="#9a3412">přiložený na plynovou</text>
  <text x="70" y="236" text-anchor="middle" font-size="12" fill="#9a3412">chladivovou trubku</text>

  <!-- ===== microSD ===== -->
  <rect x="150" y="285" width="150" height="140" rx="6" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <text x="205" y="352" text-anchor="middle" font-weight="700">microSD</text>
  <text x="205" y="368" text-anchor="middle" font-size="11" fill="#6b7280">LA161078, 3.3 V</text>
  <g font-size="11" fill="#374151">
    <text x="292" y="314" text-anchor="end">SCK</text>
    <text x="292" y="344" text-anchor="end">MISO</text>
    <text x="292" y="374" text-anchor="end">MOSI</text>
    <text x="292" y="404" text-anchor="end">CS</text>
  </g>
  <use href="#vcc" x="185" y="285"/>
  <use href="#gnd" x="265" y="425"/>
  <g stroke="#7c3aed" stroke-width="2.5">
    <line x1="300" y1="310" x2="400" y2="310"/>
    <line x1="300" y1="340" x2="400" y2="340"/>
    <line x1="300" y1="370" x2="400" y2="370"/>
    <line x1="300" y1="400" x2="400" y2="400"/>
  </g>
  <text x="350" y="300" text-anchor="middle" font-size="11" fill="#7c3aed">hardwarové SPI</text>

  <!-- ===== DS18B20 ===== -->
  <line x1="600" y1="150" x2="840" y2="150" stroke="#b7791f" stroke-width="2.5"/>
  <circle cx="680" cy="150" r="4" fill="#b7791f"/>
  <line x1="680" y1="150" x2="680" y2="128" stroke="#b7791f" stroke-width="2"/>
  <rect x="672" y="88" width="16" height="40" fill="#fff7ed" stroke="#111827" stroke-width="2"/>
  <use href="#vcc" x="680" y="88"/>
  <text x="696" y="106" font-size="12" font-weight="700">4,7 kΩ</text>
  <text x="696" y="121" font-size="11" fill="#b91c1c">pull-up, nutný</text>
  <text x="760" y="168" text-anchor="middle" font-size="11" fill="#b7791f">1-Wire, DATA (žlutý)</text>

  <rect x="840" y="110" width="140" height="90" rx="6" fill="#f9fafb" stroke="#374151" stroke-width="2"/>
  <text x="914" y="146" text-anchor="middle" font-weight="700">DS18B20</text>
  <text x="914" y="163" text-anchor="middle" font-size="11" fill="#6b7280">vodotěsná sonda na</text>
  <text x="914" y="178" text-anchor="middle" font-size="11" fill="#6b7280">výstupu otopné vody</text>
  <polyline points="840,125 812,125 812,104" fill="none" stroke="#dc2626" stroke-width="2"/>
  <use href="#vcc" x="812" y="104"/>
  <polyline points="840,185 812,185 812,196" fill="none" stroke="#111827" stroke-width="2"/>
  <use href="#gnd" x="812" y="196"/>
  <text x="806" y="121" text-anchor="end" font-size="10" fill="#dc2626">červený</text>
  <text x="798" y="189" text-anchor="end" font-size="10" fill="#111827">černý</text>

  <!-- ===== SHT40 (optional) ===== -->
  <g stroke="#059669" stroke-width="2.5">
    <line x1="600" y1="340" x2="840" y2="340"/>
    <line x1="600" y1="370" x2="840" y2="370"/>
  </g>
  <text x="720" y="332" text-anchor="middle" font-size="11" fill="#059669">I²C SDA</text>
  <text x="720" y="388" text-anchor="middle" font-size="11" fill="#059669">I²C SCL</text>
  <rect x="840" y="300" width="140" height="110" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="2" stroke-dasharray="6 4"/>
  <g font-size="11" fill="#374151">
    <text x="848" y="344">SDA</text>
    <text x="848" y="374">SCL</text>
  </g>
  <text x="922" y="350" text-anchor="middle" font-weight="700">SHT40</text>
  <text x="922" y="366" text-anchor="middle" font-size="11" fill="#6b7280">nebo SHT31</text>
  <text x="910" y="398" text-anchor="middle" font-size="11" fill="#059669">volitelné čidlo místnosti</text>
  <use href="#vcc" x="870" y="300"/>
  <use href="#gnd" x="950" y="410"/>

  <text x="980" y="456" text-anchor="end" font-size="11" fill="#374151">AM2301 / DHT21 místo SHT40: DATA → GPIO33</text>
  <text x="980" y="471" text-anchor="end" font-size="11" fill="#374151">+ 4,7 kΩ na 3V3 (vlastní protokol, ne na sběrnici 1-Wire)</text>

  <!-- ===== Notes ===== -->
  <line x1="20" y1="548" x2="980" y2="548" stroke="#e5e7eb" stroke-width="1"/>
  <text x="20" y="566" font-size="12" fill="#374151">Moduly napájí pin 3V3 desky ESP32, GND je společná. Na GPIO nikdy 5 V, GND nikdy nespojovat s trubkou.</text>
  <text x="980" y="566" text-anchor="end" font-size="12" fill="#6b7280">Logické schéma, ne pořadí pinů na desce</text>
</svg>
